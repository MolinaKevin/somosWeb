<!DOCTYPE html>
<html class="scroll-smooth" lang="de">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>SOMOS – Profil wählen</title>
    <meta name="description" content="Wähle ein Profil, um bei SOMOS weiterzumachen." />
    <meta name="robots" content="noindex,follow" />

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2D5A27",
              "background-light": "#F9F4E8",
              accent: "#E9AC57",
            },
            fontFamily: {
              display: ["Crimson Pro", "serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="font-body bg-stone-300 text-gray-900 min-h-screen flex items-center justify-center px-4 py-12">
    <main class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-8 sm:p-12">
      <div class="flex flex-col items-center text-center">
        <img src="../../logo.png" alt="SOMOS" class="h-16 object-contain mb-6" />
        <h1 class="font-display text-2xl sm:text-3xl font-bold text-gray-900">Als wen möchtest du handeln?</h1>
        <p class="mt-3 text-gray-500 max-w-md">
          Wähle ein Profil aus, um weiterzumachen. Du kannst später jederzeit wechseln.
        </p>
      </div>

      <div class="mt-10 grid grid-cols-2 sm:grid-cols-4 gap-4">
        <a
          href="../app/"
          class="flex flex-col items-center gap-3 rounded-2xl border border-green-100 bg-green-50 p-5 text-center hover:shadow-md hover:border-green-200 transition"
        >
          <span class="w-14 h-14 rounded-full bg-green-100 text-green-700 font-bold flex items-center justify-center">LV</span>
          <span class="font-semibold text-gray-900 text-sm">Lena Vogel</span>
          <span class="text-xs font-medium text-gray-500 bg-white rounded-full px-3 py-1">Persönlich</span>
        </a>

        <button
          type="button"
          onclick="showDemoModal(event)"
          class="flex flex-col items-center gap-3 rounded-2xl border border-orange-100 bg-orange-50 p-5 text-center hover:shadow-md hover:border-orange-200 transition"
        >
          <span class="w-14 h-14 rounded-full bg-orange-100 text-orange-700 font-bold flex items-center justify-center">CN</span>
          <span class="font-semibold text-gray-900 text-sm">Café Nordwind</span>
          <span class="text-xs font-medium text-gray-500 bg-white rounded-full px-3 py-1">Geschäft</span>
        </button>

        <button
          type="button"
          onclick="showDemoModal(event)"
          class="flex flex-col items-center gap-3 rounded-2xl border border-yellow-100 bg-yellow-50 p-5 text-center hover:shadow-md hover:border-yellow-200 transition"
        >
          <span class="w-14 h-14 rounded-full bg-yellow-100 text-yellow-700 font-bold flex items-center justify-center">FB</span>
          <span class="font-semibold text-gray-900 text-sm">FSV Babelsberg</span>
          <span class="text-xs font-medium text-gray-500 bg-white rounded-full px-3 py-1">Verein</span>
        </button>

        <button
          type="button"
          onclick="showDemoModal(event)"
          class="flex flex-col items-center gap-3 rounded-2xl border border-blue-100 bg-blue-50 p-5 text-center hover:shadow-md hover:border-blue-200 transition"
        >
          <span class="w-14 h-14 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center">RC</span>
          <span class="font-semibold text-gray-900 text-sm">Repair Café Potsdam</span>
          <span class="text-xs font-medium text-gray-500 bg-white rounded-full px-3 py-1">Initiative</span>
        </button>
      </div>

      <div class="mt-8 flex items-center justify-between">
        <button
          type="button"
          onclick="showDemoModal(event)"
          class="inline-flex items-center gap-2 bg-background-light text-primary font-semibold text-sm px-4 py-2.5 rounded-full hover:opacity-80 transition-opacity"
        >
          <span class="text-lg leading-none">+</span> Neues Profil hinzufügen
        </button>
        <a href="../" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">Abmelden</a>
      </div>
    </main>

    <!-- Demo restriction modal -->
    <div id="demo-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden" onclick="hideDemoModal(event)">
      <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-white rounded-3xl shadow-2xl p-10 max-w-sm w-full mx-4 text-center" onclick="event.stopPropagation()">
        <div class="text-5xl mb-4">🔒</div>
        <h3 class="text-2xl font-bold text-gray-900 mb-3">Nur in der Demo</h3>
        <p class="text-gray-500 mb-6">
          Dieses Profil ist in der Demo nicht verfügbar.<br />
          Wähle <strong class="text-gray-700">„Lena Vogel“</strong>, um fortzufahren.
        </p>
        <button onclick="hideDemoModal()" class="bg-primary text-white px-8 py-3 rounded-full font-semibold hover:opacity-90 transition-opacity">
          OK
        </button>
      </div>
    </div>

    <script>
      function showDemoModal(e) {
        e.preventDefault();
        document.getElementById("demo-modal").classList.remove("hidden");
      }
      function hideDemoModal(e) {
        document.getElementById("demo-modal").classList.add("hidden");
      }
    </script>
  </body>
</html>
